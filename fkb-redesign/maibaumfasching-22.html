<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maibaum-Fasching 2022 – FKB Berthelsdorf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf7;--card:#fff;--text:#1d2316;--muted:#5d6652;--green:#6a9a1f;--green-d:#4d7413;--red:#d62828;--line:#e6e8df;--soft:#f1f5e8}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:inherit}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none}
.brand img{height:40px}
.nav ul{display:flex;gap:4px;list-style:none;padding:0;margin-left:auto}
.nav ul a{text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:.95rem;color:var(--muted)}
.nav ul a:hover{background:var(--soft);color:var(--text)}
#menu{cursor:pointer;display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--text);font:inherit}
@media(max-width:820px){#menu{display:block}.nav ul{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);padding:8px 16px 16px;border-bottom:1px solid var(--line)}#mt:checked~ul{display:flex}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:56px 0}
.eyebrow{color:var(--green-d);font-weight:600;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:12px 0 16px;letter-spacing:-.02em}
h1 span{color:var(--red)}
.lead{color:var(--muted);font-size:1.1rem;max-width:46ch}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{border:1px solid var(--line)}
.hero figure{position:relative}
.hero figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;display:block}
.hero figcaption{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:4px 10px;border-radius:999px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:32px 0;gap:24px}}
section{padding:48px 0}
h2{font-size:1.7rem;letter-spacing:-.01em;margin-bottom:20px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.card h3{font-size:1.3rem;margin:6px 0 12px}
.card p{color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--green-d)}
.link{display:inline-block;margin-top:16px;font-weight:600;color:var(--red);text-decoration:none}
.kk{display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.kk img{width:90px;border-radius:12px}
.timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.timeline a{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;transition:.2s}
.timeline a:hover{border-color:var(--green);transform:translateY(-2px)}
.timeline small{color:var(--green-d);font-weight:600}
.timeline strong{display:block;margin-top:4px}
.insta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(120deg,#833ab4,#fd1d1d,#fcb045);color:#fff;border-radius:20px;padding:32px}
.insta h2{margin:0}
.insta .btn{background:#fff;color:#111}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.page-hero{padding:48px 0 8px}.page-hero h1{margin:8px 0}
.content p{max-width:72ch;margin:0 0 16px;color:var(--text)}.content h3{margin:28px 0 10px;font-size:1.25rem;color:var(--green-d)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:24px 0}
.gallery img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.gallery a{display:block;border-radius:12px;outline:2px solid transparent}.gallery a:hover{outline-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 24px}.chips a{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;text-decoration:none;font-weight:600;font-size:.9rem}
.chips a:hover{border-color:var(--green)}.nav ul a.active{color:var(--text);background:var(--soft)}
.back{display:inline-block;margin:8px 0 0;color:var(--muted);text-decoration:none;font-weight:600}
</style>
</head><body>
